<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy War Room</title>
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=JSON.parse(t);}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot-live" id="pulse"></span>
      <h1>War Room</h1>
      <span class="wk" id="weeklabel"></span>
    </div>
    <nav class="nav" id="nav">
      <button class="navbtn active" data-view="live">⚡ Live</button>
      <button class="navbtn" data-view="rosters">👥 Rosters</button>
      <button class="navbtn" data-view="trade">⇄ Trade</button>
      <button class="navbtn" data-view="lab">📊 Lab</button>
    </nav>
    <div class="tools">
      <button id="rootingBtn" class="ghost" title="Who to root for across all your leagues">🔥 Rooting</button>
      <button id="settingsBtn" class="ghost" title="Settings &amp; AI analyst">⚙</button>
      <button id="themeBtn" class="ghost" aria-label="Toggle theme" title="Toggle theme"></button>
    </div>
  </header>

  <div id="leaguebar" class="leaguebar" hidden></div>
  <div id="banner" class="banner" hidden></div>

  <section id="view-live" class="view">
    <div class="livebar">
      <span class="summary" id="summary"></span>
      <span class="livebar-right">
        <span class="updated" id="updated"></span>
        <label class="auto"><input type="checkbox" id="benches"> benches</label>
        <label class="auto"><input type="checkbox" id="autoref"> auto-refresh
          <select id="interval">
            <option value="15">15s</option>
            <option value="30" selected>30s</option>
            <option value="60">60s</option>
          </select>
        </label>
        <button id="refresh" class="ghost">↻ Refresh</button>
      </span>
    </div>
    <div id="watch" class="watch" hidden></div>
    <main id="grid" class="grid"></main>
  </section>

  <section id="view-rosters" class="view" hidden></section>
  <section id="view-trade" class="view" hidden></section>
  <section id="view-lab" class="view" hidden></section>

  <footer class="foot">
    Scores read live from Sleeper &amp; ESPN. Projections, values, odds and AI analysis are estimates, not advice.
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle"></span>
        <button id="modalClose" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="pmodal" class="modal" hidden>
    <div class="modal-card wide pm-card">
      <div class="pm-bar">
        <div class="pm-tabs" id="pmTabs"></div>
        <div class="pm-search">
          <input id="pmSearch" type="text" placeholder="🔍 Search players…" autocomplete="off">
          <div id="pmResults" class="pm-results" hidden></div>
        </div>
        <button id="pmClose" class="modal-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body pm-body" id="pmBody"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/trade.js"></script>
</body>
</html>
